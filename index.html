<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <title>Library</title>
</head>
<body>
    <div class="page-wrapper">
            <div class="header">
                CONCEPTUAL LIBRARY
            </div>

            <div class="main-page">
                <div class="book-section">
                    <!-- Content dynamically added by script.js -->
                </div>

                <div class="button-section">
                    <button id="add-book-button" class="non-card-buttons">ADD BOOK</button>
                    <div id="book-form-container" style="display:none;">
                        <form action="#" id="book-form">
                            <input type="text" id="title" name="title" placeholder="Title">
                            <input type="text" id="author" name="author" placeholder="Author">
                            <input type="number" id="pages" name="pages" placeholder="Pages">
                            <label>
                                Read? <input type="checkbox" id="read_status" name="read_status">
                            </label>
                            <button type="submit" class="card-buttons">SUBMIT</button>
                        </form>
                    </div>
                </div>
            </div>
    </div>
</body>
</html>
